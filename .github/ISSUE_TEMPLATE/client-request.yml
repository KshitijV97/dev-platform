name: Client request
description: Work requested by a client. Keep scope and acceptance explicit.
title: "[client] "
labels: ["type:client", "status:triage"]
body:
  - type: input
    id: client
    attributes:
      label: Client
      description: Use the same slug as the `client:<slug>` label.
      placeholder: "acme"
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request
      description: What did the client ask for, in their words?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will the client and I agree this is done?
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: Deadline
      description: Date or "none agreed".
      placeholder: "2026-12-15"
  - type: textarea
    id: out-of-scope
    attributes:
      label: Explicitly out of scope
      description: Protect the boundary before work starts.
  - type: dropdown
    id: billing
    attributes:
      label: Billing
      options:
        - Included in retainer
        - Fixed price
        - Hourly
        - Goodwill / no charge
        - Not agreed
    validations:
      required: true
